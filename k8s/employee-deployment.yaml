apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-app
  namespace: employee

spec:

  replicas: 2

  selector:
    matchLabels:
      app: employee-app

  template:

    metadata:
      labels:
        app: employee-app

    spec:

      containers:

        - name: employee-app

          image: ashugedekar/employee-app:6

          ports:
            - containerPort: 8081

          env:

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: SPRING_DATASOURCE_PASSWORD
