apiVersion: v1
kind: ConfigMap

metadata:
  name: nginx-config
  namespace: employee

data:
  nginx.conf: |
    events {}

    http {

      upstream springboot {
        server employee-app:8081;
      }

      server {

        listen 80;

        location / {

          proxy_pass http://springboot;

          # proxy_set_header Host $host;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;

        }

      }

    }
