<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">

        Employee Management System

    </h2>


      <a th:href="@{/add}" class="btn btn-primary mb-3">Add Employee</a>



    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.id}"></td>

            <td th:text="${employee.name}"></td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.department}"></td>

            <td th:text="${employee.salary}"></td>
            
	    <td><a th:href="@{/edit/{id}(id=${employee.id})}" class="btn btn-warning btn-sm">Edit</a></td>
            <a th:href="@{/delete/{id}(id=${employee.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this employee?')">Delete</a>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
